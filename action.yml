name: Release
description: Automated releases via release-please
inputs:
  create-major-minor-tags:
    description: Create major/minor tags automatically on release (e.g. v1, v1.1)
    required: false
    default: "false"
  prerelease:
    description: Create a pre-release (e.g. v1.0.0-0)
    required: false
    default: ${{ github.ref_name == 'dev' }}
  repo-token:
    description: GitHub token (e.g. secrets.GITHUB_TOKEN). This repo-specific token is required so that we can get the owner and repo name.
    required: true
  github-app-id:
    description: Installed GitHub App Id (e.g. secrets.UGRC_RELEASE_BOT_APP_ID)
    required: true
  github-app-key:
    description: Installed GitHub App Key (e.g. secrets.UGRC_RELEASE_BOT_APP_KEY)
    required: true
  github-app-name:
    description: Installed GitHub Name (e.g. secrets.UGRC_RELEASE_BOT_NAME)
    required: true
  github-app-email:
    description: Installed GitHub Email (e.g. secrets.UGRC_RELEASE_BOT_EMAIL)
    required: true
  release-type:
    description: Release Please release type
    required: false
    default: node
  extra-files:
    description: Extra files in which release please should bump the version
    required: false
outputs:
  release_created:
    description: A release was successfully created
    value: ${{ steps.release-details.outputs.release_created }}
  released_version:
    description: The version number that was released
    value: ${{ steps.release-details.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: 🪙 Convert token
      if: ${{ !env.ACT }}
      uses: actions/create-github-app-token@v3
      id: generate-token
      with:
        client-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-key }}

    - name: 🎭 Mock convert token
      if: ${{ env.ACT }}
      id: mock-generate-token
      shell: bash
      run: |
        echo "token=${{ env.TEST_TOKEN }}" >> $GITHUB_OUTPUT

    - name: ⬇️ Set up code
      uses: actions/checkout@v7
      with:
        show-progress: false
        token: ${{ steps.generate-token.outputs.token || steps.mock-generate-token.outputs.token }}

    - name: 🤔 Is this a release PR merge
      id: is-release-pr
      uses: actions/github-script@v9
      with:
        result-encoding: string
        retries: 3
        script: |
          const response = (
            await github.rest.repos.listPullRequestsAssociatedWithCommit({
              commit_sha: context.sha,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
          );

          for (const pullRequest of response.data) {
            if (
              pullRequest.base.ref === context.ref.replace('refs/heads/', '') &&
              pullRequest.state === 'closed' &&
              pullRequest.labels.some(label => label.name === 'autorelease: pending')
            ) {
              console.log('this workflow was triggered by a release PR');

              return 'yes';
            }
          }

          console.log('this workflow was *not* triggered by a release PR');
          return 'no';

    - name: ⏩ Get next version
      if: ${{ !env.ACT }}
      id: get-next-version
      uses: agrc/get-next-version-action@v1
      with:
        prerelease: ${{ inputs.prerelease }}
        repo-token: ${{ inputs.repo-token }}

    - name: 🎭 Mock get next version
      if: ${{ env.ACT }}
      id: mock-get-next-version
      shell: bash
      run: |
        echo "version=999.99.9" >> $GITHUB_OUTPUT
        echo "major=999" >> $GITHUB_OUTPUT
        echo "minor=99" >> $GITHUB_OUTPUT

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: 📦 Setup PNPM
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: ⚙️ Set up PNPM config
      shell: bash
      run: |
        # 7-day quarantine
        echo "PNPM_CONFIG_MINIMUM_RELEASE_AGE=10080" >> "$GITHUB_ENV"

    - name: 🚀 Create release PR
      id: create-release-pr
      if: ${{ steps.is-release-pr.outputs.result == 'no' }}
      shell: bash
      run: |
        pnpm dlx release-please@17 release-pr \
          --pull-request-title-pattern "chore: release v\${version}" \
          --pull-request-header " " \
          --changelog-sections "feat,fix,deps,docs,style" \
          --token ${{ steps.generate-token.outputs.token || steps.mock-generate-token.outputs.token }} \
          --repo-url ${{ github.repositoryUrl || 'https://github.com/agrc/release-composite-action' }} \
          --target-branch ${{ github.ref_name }} \
          --release-type ${{ inputs.release-type }} \
          --extra-files "${{ inputs.extra-files }}" \
          --release-as ${{ steps.get-next-version.outputs.version || steps.mock-get-next-version.outputs.version }}

    - name: 🚀 Create GitHub release
      id: create-github-release
      if: ${{ steps.is-release-pr.outputs.result == 'yes' }}
      shell: bash
      run: |
        pnpm dlx release-please@17 github-release \
          --token ${{ steps.generate-token.outputs.token || steps.mock-generate-token.outputs.token }} \
          --repo-url ${{ github.repositoryUrl || 'https://github.com/agrc/release-composite-action' }} \
          --target-branch ${{ github.ref_name }} \
          --prerelease ${{ inputs.prerelease }} \
          --release-type ${{ inputs.release-type }}

    - name: Read published release
      id: release-details
      if: ${{ steps.create-github-release.outcome == 'success' }}
      uses: actions/github-script@v9
      env:
        PRERELEASE: ${{ inputs.prerelease }}
      with:
        github-token: ${{ steps.generate-token.outputs.token || steps.mock-generate-token.outputs.token }}
        script: |
          for await (const response of github.paginate.iterator(
            github.rest.repos.listReleases,
            { ...context.repo, per_page: 100 },
          )) {
            for (const release of response.data) {
              if (release.draft || release.prerelease !== (process.env.PRERELEASE === 'true')) {
                continue;
              }

              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: `refs/tags/${release.tag_name}`,
              });
              if (commit.sha !== context.sha) {
                continue;
              }

              const match = /^v(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.exec(release.tag_name);
              if (!match) {
                throw new Error(`Unexpected release tag: ${release.tag_name}`);
              }

              core.setOutput('version', release.tag_name.slice(1));
              core.setOutput('major', match[1]);
              core.setOutput('minor', match[2]);
              core.setOutput('tag', release.tag_name);
              core.setOutput('sha', commit.sha);
              core.setOutput('release_created', 'yes');
              return;
            }
          }

          throw new Error(`No published release found for ${context.sha}`);

    - name: 🔑 Set git user
      shell: bash
      run: |
        git config user.name "${{ inputs.github-app-name }}"
        git config user.email "${{ inputs.github-app-email }}"

    - name: 🏷️ Tag major and minor versions
      shell: bash
      if: ${{ inputs.create-major-minor-tags == 'true' && steps.release-details.outputs.release_created == 'yes' && inputs.prerelease != 'true' }}
      env:
        MAJOR: ${{ steps.release-details.outputs.major }}
        MINOR: ${{ steps.release-details.outputs.minor }}
        RELEASE_TAG: ${{ steps.release-details.outputs.tag }}
        RELEASE_SHA: ${{ steps.release-details.outputs.sha }}
      run: |
        git fetch origin "refs/tags/$RELEASE_TAG"
        git tag -fa "v$MAJOR" "$RELEASE_SHA" -m "Release v$MAJOR"
        git tag -fa "v$MAJOR.$MINOR" "$RELEASE_SHA" -m "Release v$MAJOR.$MINOR"
        git push --atomic --force origin "refs/tags/v$MAJOR" "refs/tags/v$MAJOR.$MINOR"
